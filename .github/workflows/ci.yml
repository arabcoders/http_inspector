name: CI

on:
    workflow_call:
    workflow_dispatch:
    pull_request:
        branches:
            - master
        paths-ignore:
            - "**.md"
            - ".github/ISSUE_TEMPLATE/**"

env:
    BUN_VERSION: 1.4.2

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run Lint
              run: bun run lint

            - name: Run tests
              run: bun run test
            
            - name: Run type-check
              run: bun run tsc

            - name: Build
              run: bun run build
