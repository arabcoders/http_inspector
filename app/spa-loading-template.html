<div role="status" aria-label="Loading HTTP Inspector" class="inspector-loading">
  <style>
    .inspector-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top left, #e0e7ff, transparent 55%), #f8fafc;
      color: #1c1917;
      font: 600 0.875rem system-ui, sans-serif;
    }
    .inspector-loading span {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border: 1px solid #d6d3d1;
      border-radius: 0.5rem;
      padding: 0.875rem 1rem;
    }
    @media (prefers-color-scheme: dark) {
      .inspector-loading {
        background: radial-gradient(ellipse at top left, #1e1b4b, transparent 55%), #111827;
        color: #fafaf9;
      }
      .inspector-loading span {
        border-color: #44403c;
      }
    }
  </style>
  <span><img src="/favicon.svg" width="24" height="24" alt=""> Opening HTTP Inspector…</span>
</div>
